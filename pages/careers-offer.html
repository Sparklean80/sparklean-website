<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Conditional offer | Sparklean Cleaning</title>
<link rel="stylesheet" href="/css/sparklean-nav-logo.css">
<link rel="stylesheet" href="/css/sparklean-site-header.css">
<link rel="stylesheet" href="/css/sparklean-careers.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#B8A47A;--gold-lt:#D4BF96;--dark:#0E0E0E;--white:#F9F7F3;--w70:rgba(249,247,243,.7);--serif:'Playfair Display',Georgia,serif;--sans:'Montserrat',sans-serif;--nav-h:96px;}
body{background:var(--dark);color:var(--white);font-family:var(--sans);font-weight:300;}
.btn-gold{display:inline-flex;font-size:.58rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#0E0E0E;background:var(--gold);padding:15px 32px;border:0;cursor:pointer;}
</style>
</head>
<body>
<p class="careers-review-banner">FOUNDER REVIEW — TEST DATA ONLY. This is not a real conditional offer and is not emailed.</p>
<header class="site-header" id="site-header">
 <nav aria-label="Primary">
 <a href="/" class="nav-logo"><img width="2048" height="1449" src="https://cdn.prod.website-files.com/69b2101ca55e3c42c4f97568/69b21b5c7958824a1f172b0f_sparklean-logo-transparent.png" alt="Sparklean Cleaning"></a>
 </nav>
</header>
<main class="careers-shell">
 <p class="careers-kicker">Conditional offer</p>
 <h1>Review and <em>accept</em></h1>
 <div class="careers-error" id="careers-error" hidden></div>
 <div class="careers-card">
  <pre class="careers-pre" id="offer-body">Loading…</pre>
  <p class="careers-ok" id="offer-accepted" hidden>This offer has already been accepted.</p>
  <form id="form-offer">
   <p class="careers-actions"><button class="btn-gold" type="button" id="fill-test-applicant" hidden>Fill TEST signature</button></p>
   <label>Type your full legal name to accept <input id="offer_signature" required></label>
   <div class="careers-actions"><button class="btn-gold" type="submit">Accept TEST offer (not real)</button></div>
  </form>
 </div>
</main>
<script src="/js/sparklean-careers-review.js"></script>
<script src="/js/sparklean-careers-offer.js"></script>
</body>
</html>
